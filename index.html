  <body>
    <div id="tabs"></div>
    <div id="main">
      <div id="app"></div>
      <aside id="sidebar">
        <h2 id="sidebar-title"></h2>
        <div id="sidebar-controls">
          <div class="controls">
            <label
              >surface
              <select class="surfacemode">
                <option value="off" selected>off</option>
                <option value="photo">photo</option>
                <option value="elev">elevation</option>
              </select></label
            >
            <label>3D <input type="checkbox" class="terrainbox" /></label>
            <label
              >relief
              <input
                type="range"
                class="vexag"
                min="0"
                max="4"
                step="0.25"
                value="1"
            /></label>
            <label
              >contours <input type="checkbox" class="contourbox" checked
            /></label>
            <label
              >labels <input type="checkbox" class="labelbox" checked
            /></label>
            <label>auto-spin <input type="checkbox" class="spinbox" /></label>
          </div>
        </div>
      </aside>
    </div>

    <script src="d3.min.js"></script>
    <script src="app.js"></script>
  </body>
